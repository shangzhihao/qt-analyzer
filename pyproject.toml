[project]
name = "qt-analyzer"
version = "0.1.0"
description = "Analyse pytest report logs of a non-deterministic test suite, state by state."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=17",
]

[project.scripts]
qt-analyzer = "qt_analyzer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
