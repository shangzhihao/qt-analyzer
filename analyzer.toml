# Thresholds and windows for `qt-analyzer analyse`. Every key is optional.
[analysis]
# Earlier measured main states pooled into a baseline.
pool_k = 5
# Chance per state that noise alone is reported as a drop, split over the
# overall scope and every family.
push_alpha_per_state = 0.05      # 1-run signal: "suspected"
# Nightly step and drift tests: a scope at or below this z is "confirmed".
# About 4 false issues per month on the real suite's distribution.
nightly_z = -2.5
nightly_case_fdr = 0.05          # cases with q <= this are listed as evidence
# The reference moves only if a state shows no hint of a drop at this level.
reference_move_alpha_per_state = 0.2
pr_alpha = 0.05                  # PR overall/family drop
pr_case_p = 0.05                 # PR single case marked "suspected"

# Gate algorithm that makes the decisions: zscore (default; uses the thresholds
# above), testimate_threshold, poisson_binomial, bayes, or one of your own.
gate = "zscore"
# Modules that register more gates with @register_gate (see gates.py).
gate_modules = []

# Settings per gate, passed as keyword arguments.
[gates.bayes]
delta = 0.03
probability = 0.99

[gates.poisson_binomial]
significance_level = 0.05
