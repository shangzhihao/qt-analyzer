# Thresholds and windows for `qt-analyzer analyse`. Every key is optional.
[analysis]
# Earlier measured main states pooled into a baseline.
pool_k = 5
# Chance per state that noise alone is reported as a drop, split over the
# overall scope and every family.
push_alpha_per_state = 0.05      # 1-run signal: "suspected"
# Nightly step and drift tests: a scope at or below this z is "confirmed".
# About 4 false issues per month on the real suite's distribution.
nightly_z = -2.5
nightly_case_fdr = 0.05          # cases with q <= this are listed as evidence
# The reference moves only if a state shows no hint of a drop at this level.
reference_move_alpha_per_state = 0.2
pr_alpha = 0.05                  # PR overall/family drop
pr_case_p = 0.05                 # PR single case marked "suspected"

# Gate algorithm that makes the decisions: zscore_strata (chosen: best worst
# case in simulation and on real testimate history), zscore (uses the
# thresholds above), testimate_threshold, poisson_binomial, bayes, or your own.
gate = "zscore_strata"
# Modules that register more gates with @register_gate (see gates.py).
gate_modules = []
# Locator that says where a flagged change is (see locators.py).
locator = "ranked"

# Settings per gate, passed as keyword arguments; [gates.<name>.<stage>]
# overrides them for "push", "nightly" or "pr".
#
# zscore_strata, tuned on the real vws-graph pass-rate distribution
# (`qt-analyzer gates --benchmark --equal-false-alarms ...`, 2,000 draws):
# - nightly (10 vs 10 runs): about 3-4 % false regressions and false
#   improvements per comparison, i.e. about 4 false issues per month at
#   60 nightly states with a step and a drift test each.
# - push and PR (1 run vs a pooled baseline): about 5 % false "suspected"
#   regressions and 4 % false improvements; these never open issues.
[gates.zscore_strata]
alpha = 0.05
improvement_alpha = 0.01

[gates.zscore_strata.push]
alpha = 0.25
improvement_alpha = 0.2

[gates.zscore_strata.nightly]
alpha = 0.013
improvement_alpha = 0.0026

[gates.zscore_strata.pr]
alpha = 0.25
improvement_alpha = 0.2

[gates.bayes]
delta = 0.03
probability = 0.99

[gates.poisson_binomial]
significance_level = 0.05

[locators.ranked]
top_scopes = 3
top_cases = 10
